name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    name: Dependency vulnerability review
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acf6bb0a4d6c0eb0c4d0e1b0a3a0f9d7c7c4 # v2.6.0
